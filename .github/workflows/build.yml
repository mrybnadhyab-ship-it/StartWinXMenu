name: Build StartWinXMenu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "===== Files in repository ====="
          ls -lah

      - name: Find StartWinXMenu ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'StartWinXMenu*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No StartWinXMenu ZIP file found."
            echo "Expected something like:"
            echo "StartWinXMenu-GitHub-FIXED-JVM17-FIXED.zip"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Unzip project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "===== Extracted files ====="
          find project -maxdepth 3 -type f | sort | head -200

      - name: Locate Gradle project
        shell: bash
        run: |
          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."

            echo "===== Project tree ====="
            find project -maxdepth 5 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle settings:"
          echo "$SETTINGS"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Show Java and Gradle versions
        shell: bash
        run: |
          java -version
          gradle --version

      - name: Build project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "===== Building project ====="

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK files ====="

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StartWinXMenu-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
