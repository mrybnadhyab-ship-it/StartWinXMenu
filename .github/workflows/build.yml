name: Build StartWinXMenu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q StartWinXMenu-GitHub.zip -d project

          SETTINGS=$(find project -name settings.gradle -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Fix JVM target compatibility
        run: |
          cd "$PROJECT_DIR"

          echo "Fixing Java/Kotlin JVM target..."

          find . -name "build.gradle" -type f -print0 | while IFS= read -r -d '' file
          do
            echo "Checking: $file"

            if grep -q "android {" "$file"; then

              if grep -q "compileOptions {" "$file"; then
                sed -i '/compileOptions {/,/}/ s/sourceCompatibility JavaVersion.VERSION_[0-9.]*/sourceCompatibility JavaVersion.VERSION_17/' "$file"
                sed -i '/compileOptions {/,/}/ s/targetCompatibility JavaVersion.VERSION_[0-9.]*/targetCompatibility JavaVersion.VERSION_17/' "$file"
              else
                sed -i '/android {/a\
    compileOptions {\
        sourceCompatibility JavaVersion.VERSION_17\
        targetCompatibility JavaVersion.VERSION_17\
    }' "$file"
              fi

              if grep -q "kotlinOptions {" "$file"; then
                sed -i '/kotlinOptions {/,/}/ s/jvmTarget *= *.*/jvmTarget = "17"/' "$file"
              else
                sed -i '/android {/a\
    kotlinOptions {\
        jvmTarget = "17"\
    }' "$file"
              fi

            fi
          done

          echo "JVM compatibility after modification:"
          grep -R -n \
            -e "sourceCompatibility" \
            -e "targetCompatibility" \
            -e "jvmTarget" \
            --include="build.gradle" .

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StartWinXMenu-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
