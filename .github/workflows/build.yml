- name: Unzip project
  run: |
    mkdir project
    unzip -q StartWinXMenu-GitHub-FIXED-JVM17.zip -d project

    SETTINGS=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)

    if [ -z "$SETTINGS" ]; then
      echo "settings.gradle or settings.gradle.kts not found"
      exit 1
    fi

    PROJECT_DIR=$(dirname "$SETTINGS")
    echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
